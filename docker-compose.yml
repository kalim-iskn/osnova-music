name: waveflow

services:
  app:
    container_name: waveflow-app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      # быстрый vendor для PHP (vendor copy в windows: docker cp work_project_php:/opt/app/vendor ./vendor)
      - vendor_data:/var/www/html/vendor
      - ./docker/supervisor/supervisord.conf:/etc/supervisor.d/supervisord.ini:ro

  db:
    container_name: waveflow-db
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waveflow}
      POSTGRES_USER: ${POSTGRES_USER:-waveflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waveflow}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waveflow} -d ${POSTGRES_DB:-waveflow}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
    name: waveflow_postgres_data
  vendor_data:
    name: waveflow_vendor_data

networks:
  default:
    name: waveflow_default
    ipam:
      config:
        - subnet: 10.254.254.0/24
